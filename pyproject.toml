[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etchmem"
version = "0.3.0"
description = "Python SDK for etchmem-server 0.0.4 — the Knowledge Consolidation Engine for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Andrey Olishchuk" }]
keywords = ["llm", "agent", "memory", "knowledge", "consolidation", "rag", "sdk", "rest", "client", "etchmem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "build",
    "twine",
]

[project.urls]
Repository = "https://github.com/vossmoos/etchmem-sdk-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["etchmem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
